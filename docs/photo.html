<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#33658a">
<meta name="robots" content="noindex">
<title>Alixo — Envoyer vers l’ordinateur</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<!-- Page du téléphone pour « Photo depuis le téléphone » (1.40) et « Importer depuis un téléphone » (1.52) : ouverte en
     scannant le QR code affiché par Alixo sur l'ordinateur (adresse : alixoapp.com/docs/photo.html#<session>). Aucun compte.
     Voir js/photo.js et js/photodrop.js. -->
<style>
  :root { --tint: #33658a; --bg: #f4f6f8; --card: #fff; --ink: #1d2329; --ink2: #5b6570; --line: #dfe4ea; --ok: #2f9e5b; --warn: #f08a24; --err: #d64545; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --tint: #6fa3cc; --bg: #14181d; --card: #1d232a; --ink: #e8ecf0; --ink2: #a0abb6; --line: #2d353e; --ok: #4cc47e; --warn: #ff9f43; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; display: flex; flex-direction: column; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  .top { display: flex; align-items: center; gap: 8px; padding: 14px 0; font-weight: 700; font-size: 17px; }
  .top img { width: 26px; height: 26px; border-radius: 7px; }
  main { flex: 1; width: 100%; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 21px; line-height: 1.25; margin: 10px 0 6px; }
  .sub { color: var(--ink2); margin: 0 0 20px; font-size: 15px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 58px; border-radius: 14px; border: 0; font: inherit; font-weight: 650; font-size: 17px; cursor: pointer; margin-bottom: 12px; -webkit-tap-highlight-color: transparent; }
  .btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.primary { background: var(--tint); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--tint) 35%, transparent); }
  .btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn:active { transform: scale(.98); }
  input[type=file] { display: none; }
  .list { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
  .item { display: flex; align-items: center; gap: 12px; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
  .item img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); }
  .item .t { flex: 1; min-width: 0; font-size: 14.5px; }
  .item .t small { display: block; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 1.52 : fichiers — icône avec extension, barre d'envoi, rappel des formats */
  .hint { color: var(--ink2); font-size: 13px; margin: -2px 0 0; text-align: center; }
  .item .fic { position: relative; width: 54px; height: 54px; flex: none; display: grid; place-items: center; border-radius: 8px; background: color-mix(in srgb, var(--tint) 10%, var(--card)); color: var(--tint); }
  .item .fic svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; }
  .item .fic b { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 8.5px; font-weight: 800; letter-spacing: .02em; color: #fff; background: var(--tint); padding: 1px 4px; border-radius: 3px; line-height: 1.3; }
  .item .bar[hidden] { display: none; }
  .item .bar { display: block; height: 5px; margin-top: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .item .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--tint); transition: width .25s; }
  .st { width: 26px; height: 26px; flex: none; display: grid; place-items: center; }
  .st svg { width: 22px; height: 22px; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .st.busy svg { stroke: var(--warn); animation: spin .8s linear infinite; }
  .st.ok svg { stroke: var(--ok); }
  .st.err svg { stroke: var(--err); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px 18px; text-align: center; margin-top: 30px; }
  .msg b { display: block; font-size: 18px; margin-bottom: 6px; }
  .msg p { margin: 0; color: var(--ink2); }
  /* 1.52 : bouton « Réessayer » sur une ligne en échec */
  .item .retry { flex: none; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--tint); font: inherit; font-size: 14.5px; font-weight: 650; cursor: pointer; }
  /* 1.56.0 : mode scan — case « Noir et blanc (mode document) », cible de 48 px au doigt */
  .chk { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 2px 4px; font-size: 15.5px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .chk input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--tint); }
  /* 1.56.0 : rappel du droit de copie (mode scan) */
  .legal { margin: -8px 0 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink2); font-size: 13.5px; line-height: 1.45; }
  /* 1.57.0 : mode scan — écran « Vérifiez le cadrage » (détection de la feuille, quatre coins à ajuster) */
  body.rv-open { overflow: hidden; }
  .rv { --acc: #3d8bfd; position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #0f1215; color: #f2f4f6; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); outline: none; }
  .rv-top { padding: 12px 16px 2px; text-align: center; }
  .rv-top h2 { margin: 0; font-size: 18px; line-height: 1.3; }
  .rv-st { margin: 4px 0 0; font-size: 14.5px; color: #c9d1d9; }
  .rv-warn { margin: 2px 0 0; min-height: 1.45em; font-size: 14.5px; font-weight: 650; color: #ffb4a8; }
  .rv-stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .rv-box { position: relative; }
  .rv-box[hidden] { display: none; }
  .rv-img { display: block; width: 100%; height: 100%; }
  .rv-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .rv-veil { fill: rgba(0, 0, 0, .55); }
  .rv-l1 { fill: none; stroke: #fff; stroke-width: 3; stroke-linejoin: round; }
  .rv-l2 { fill: none; stroke: var(--acc); stroke-width: 1.5; stroke-linejoin: round; }
  .rv-h { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; padding: 0; border: 0; border-radius: 50%; background: transparent; cursor: grab; touch-action: none; -webkit-tap-highlight-color: transparent; }
  .rv-h::after { content: ''; position: absolute; left: 13px; top: 13px; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; background: var(--acc); border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0, 0, 0, .6); transition: transform .12s; }
  .rv-h:focus { outline: none; }
  .rv-h:focus-visible::after { box-shadow: 0 0 0 3px #0f1215, 0 0 0 6px #ffd166; }
  .rv-h.on { cursor: grabbing; }
  .rv-h.on::after { transform: scale(1.25); }
  .rv-loupe { position: absolute; width: 96px; height: 96px; border-radius: 50%; overflow: hidden; border: 3px solid #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, .6); pointer-events: none; z-index: 2; }
  .rv-loupe[hidden] { display: none; }
  .rv-loupe canvas { display: block; width: 100%; height: 100%; }
  .rv-help { margin: 4px 16px 0; text-align: center; font-size: 14px; color: #c9d1d9; }
  .rv-help[hidden] { display: none; }
  .rv-sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
  /* lot : « Envoyer les suivantes sans vérifier », lien discret sous les boutons */
  .rv-rest { display: block; margin: 8px auto 0; min-height: 44px; padding: 0 12px; border: 0; background: none; color: #9cc3ff; font: inherit; font-size: 14.5px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .rv-rest:disabled { opacity: .45; cursor: not-allowed; }
  .rv-rest:focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; border-radius: 6px; }
  .rv-bar { width: 100%; max-width: 480px; margin: 0 auto; padding: 10px 16px 14px; }
  .rv-bar .btn { min-height: 52px; margin-bottom: 10px; }
  .rv-row { display: flex; gap: 10px; }
  .rv-row .btn { flex: 1; margin-bottom: 0; font-size: 15.5px; }
  .rv .btn.ghost { background: #1d232a; color: #f2f4f6; border-color: #3a434d; }
  .rv .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .rv .btn:focus-visible { outline: 3px solid #ffd166; outline-offset: 2px; }
  /* anneau jaune réservé au clavier : au toucher, le focus posé par programme (bouton principal, poignée tirée) reste discret */
  .rv.ptr .btn:focus-visible, .rv.ptr .rv-rest:focus-visible { outline: none; }
  .rv.ptr .rv-h:focus-visible::after { box-shadow: 0 1px 5px rgba(0, 0, 0, .6); }
  /* paysage (téléphone couché) : titre resserré, consigne masquée, boutons sur une ligne — la photo prend la hauteur */
  @media (max-height: 500px) {
    .rv-top { padding: 6px 16px 0; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; column-gap: 12px; }
    .rv-top h2 { font-size: 16px; }
    .rv-st, .rv-warn { margin: 0; font-size: 13.5px; }
    .rv-warn { min-height: 0; flex-basis: 100%; }
    .rv-help { display: none; }
    .rv-bar { max-width: none; display: flex; align-items: center; gap: 10px; padding: 6px 16px 8px; }
    .rv-bar .btn { min-height: 44px; margin: 0; flex: 1 1 auto; padding: 0 14px; font-size: 15px; white-space: nowrap; }
    .rv-row { flex: 2 1 auto; }
    .rv-rest { flex: 0 0 13em; max-width: none; margin: 0; line-height: 1.25; text-align: center; }
  }
  @media (prefers-reduced-motion: reduce) { .rv-h::after, .item .bar i { transition: none; } .btn:active { transform: none; } .st.busy svg { animation-duration: 2.4s; } }
  .foot { text-align: center; color: var(--ink2); font-size: 12.5px; padding: 18px 0 14px; }
  .foot a { color: inherit; }
</style>
</head>
<body>
  <div class="top"><img src="logo.png" alt="">Alixo</div>
  <main id="main"><div class="msg"><b>Connexion…</b><p>Un instant.</p></div></main>
  <div class="foot">Vos photos et fichiers passent quelques instants par le serveur d’Alixo (Google Firebase), puis en sont effacés dès leur arrivée sur votre ordinateur, qui les enregistre dans votre document et dans votre compte Alixo. · <a href="https://alixoapp.com/confidentialite.html" target="_blank" rel="noopener">confidentialité</a></div>
  <script src="firebase-config.js"></script>
  <script src="js/vendor/firebase-app-compat.js"></script>
  <script src="js/vendor/firebase-firestore-compat.js"></script>
  <script src="js/scandetect.js"></script>
  <script src="js/photo.js"></script>
</body>
</html>
